# Tier A — MNIST + SmallCNN.
#
# Sized so the full build -> scan -> report cycle finishes in well under an
# hour on a laptop. That is the entire point of Tier A: a benchmark you cannot
# re-run after changing one line is a benchmark nobody re-runs, and every
# conclusion here should be reproducible before you have finished your coffee.
#
# The sweep is deliberately unbalanced towards low poison rates. Every defense
# in the literature degrades as the poisoned subpopulation shrinks, and eps=5%
# is a much friendlier world than anyone actually operates in.

name: tierA
dataset: mnist
arch: smallcnn
width: 32
epochs: 5
batch_size: 128
lr: 0.01
augment: true
defender_per_class: 50
seeds: [0, 1, 2]

attacks:
  # Positive control. If Neural Cleanse cannot recover this, our Neural
  # Cleanse is broken, not the method.
  - attack: badnets
    poison_rates: [0.005, 0.01, 0.05]
    label_modes: [all2one]
    targets: [0, 7]
    kwargs: {patch_size: 3, margin: 1}

  # The all2all case, which trigger reconstruction is structurally unable to
  # detect: its outlier test assumes exactly one class is unusually reachable.
  - attack: badnets
    poison_rates: [0.05]
    label_modes: [all2all]
    kwargs: {patch_size: 3, margin: 1}

  # Global blend: no sparse mask exists to reconstruct.
  - attack: blended
    poison_rates: [0.01, 0.05]
    targets: [0]
    kwargs: {alpha: 0.15}

  # Warp. The reconstruction-killer, and with noise mode the STRIP-killer.
  - attack: wanet
    poison_rates: [0.05, 0.1]
    targets: [0]
    kwargs: {k: 4, s: 0.5}

  # Clean-label: every label in the dataset is correct.
  #
  # These two are EXPECTED TO FAIL the ASR precondition on MNIST, and are kept
  # here because the failure is informative rather than despite it.
  #
  # A clean-label attack may only touch images that already carry the target
  # label, so `poison_rate` is bounded by the target class's share of the data —
  # 9.9% for MNIST class 0. At rate 0.05 that is half of class 0 and the attack
  # does not implant (ASR ~0.02); at rate 0.10 it is *all* of class 0, at which
  # point every clean class-0 test image is out of distribution and clean
  # accuracy falls by exactly the class's share (0.994 -> 0.899).
  #
  # The underlying reason is that MNIST digits are trivially classifiable from
  # content, so the network never needs the trigger — which is precisely what
  # clean-label attacks depend on. This is why the literature evaluates them on
  # CIFAR-10, and why Tier B exists. Filtered runs stay in the manifest with
  # their reason attached; see the "Filtered runs" table in the report.
  - attack: sig
    poison_mode: clean_label
    poison_rates: [0.05, 0.1]
    targets: [0]
    kwargs: {delta: 0.0784, frequency: 6}

  - attack: label_consistent
    poison_mode: clean_label
    poison_rates: [0.05, 0.1]
    targets: [0]
    kwargs: {epsilon: 0.0627, pgd_steps: 10}

  # Purpose-built to break latent-statistics defenses.
  - attack: adaptive_blend
    poison_rates: [0.01, 0.05]
    targets: [0]
    cover_rates: [0.01]
    kwargs: {alpha: 0.2, train_pieces: 8}
