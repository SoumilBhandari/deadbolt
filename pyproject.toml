[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadbolt"
version = "0.2.0"
description = "A benchmark for catching backdoors in neural networks — and for finding out which detectors actually work."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Soumil Bhandari", email = "soumil.bhandari@gmail.com" }]
keywords = ["backdoor", "trojan", "machine-learning-security", "benchmark", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
deadbolt = "deadbolt.cli:main"

[project.urls]
Repository = "https://github.com/SoumilBhandari/deadbolt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks tests that train a real model; deselect with -m "not slow"
markers = ["slow: requires training a model (seconds to minutes)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Assigning `except X as e` then using e in a raise-from is not the only
    # correct pattern here; several diagnostics deliberately swallow-and-record.
    "B904",
    # Ambiguous-unicode: the docstrings use — and × on purpose.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into private helpers to test them directly, and
# fixtures shadow their own names by design.
"tests/*" = ["E501"]
